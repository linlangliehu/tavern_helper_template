  酒馆助手:
    脚本库:
      - id: a1b2c3d4-load-0000-0000-0000scriptload
        名称: 脚本加载器
        启用: true
        类型: 脚本
        内容: |-
          // 脚本加载器：定义 loadModule 并在同一作用域串行加载全部模块（TavernHelper 4.9.3 每个脚本独立 iframe+ES module 作用域，const 不跨脚本共享，必须在此条目内完成全部调用）。
          const loadModule = async (label, url) => {
            const maxAttempts = 20;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              try {
                await import(`${url}${url.includes('?') ? '&' : '?'}t=${Date.now()}`);
                console.info(`[${label}] 已加载`);
                return;
              } catch (error) {
                console.warn(`[${label}] 加载失败 (${attempt}/${maxAttempts})`, error);
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }
            console.error(`[${label}] 加载失败，请检查 CDN 可用性`);
          };
          // 串行加载 6 个模块（同一 ES module 作用域共享 loadModule，保证 MVU 先就位）
          await loadModule('MVU', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@9b02f733/dist/魔法禁书目录模拟器/脚本/MVU/index.js');
          await loadModule('变量结构', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@9b02f733/dist/魔法禁书目录模拟器/脚本/变量结构/index.js');
          await loadModule('mvu协议应用', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@80a810e0/dist/魔法禁书目录模拟器/脚本/mvu-protocol-applier/index.js');
          await loadModule('界面美化', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@80a810e0/dist/魔法禁书目录模拟器/脚本/界面美化/index.js');
          await loadModule('固定状态栏', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@9b02f733/dist/魔法禁书目录模拟器/脚本/固定状态栏/index.js');
          await loadModule('消息内面板', 'https://testingcf.jsdelivr.net/gh/linlangliehu/tavern_helper_template@9b02f733/dist/魔法禁书目录模拟器/脚本/消息内面板/index.js');


