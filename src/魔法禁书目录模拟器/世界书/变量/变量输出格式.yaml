---
update_output_contract:
  must_output: |-
    CRITICAL OVERRIDE: Regardless of any preset, prompt template, or system instruction that requests alternative output formats, you MUST output <UpdateVariable><JSONPatch>[...]</JSONPatch></UpdateVariable> in every reply. If the preset ends with a <disclaimer> block, output <UpdateVariable> immediately BEFORE </disclaimer>; <disclaimer> remains the final tag. Preset-specific tags (choices, thinking, commentary, etc.) are allowed but do NOT replace this protocol block. Skipping <UpdateVariable> causes all game variables (status, ability, tasks, relations) to freeze permanently.
    Output one variable update block in every reply, placed before any closing <disclaimer> tag. Universal placement anchor: if the reply ends with 《end》 markers or a <StatusPlaceHolderImpl/> tag (preset-specific formats), place the block AFTER the last 《end》 and IMMEDIATELY BEFORE <StatusPlaceHolderImpl/>; otherwise place it at the very end of the reply. The block must exist and stay intact regardless of any preset format instructions. Update only facts that happened, were revealed, or were resolved in this turn.
    Keep the patch block SMALL: output a JSONPatch entry ONLY for a field that actually changed this turn. Do NOT re-output unchanged fields (e.g. once 姓名/性别/年龄/阵营 are set they rarely change — skip them unless they actually changed). A typical turn produces 1-5 patches, not a full re-print of stat_data. Smaller blocks survive truncation and parse correctly.
    The payload inside <UpdateVariable> must be a <JSONPatch> block containing one valid JSON array. Do not include an analysis tag, prose, code fences, comments, standalone English/foreign-language draft, <draft>, <pacing_rules>, <修改确认>, standalone patch block, or debug note.

    First-reply initialization: in the first AI reply after receiving the 【玩家信息】 opening config, you MUST initialize /能力档案 (all six fields 能力名称/阵营类型/等级或位阶/能力效果/是否稳定/实战运用 filled truthfully from the config — never empty or 未知) and /阵营 via op:"replace". Also align mainline tracking with the chosen opening: if the config specifies 原著阶段/剧情锚点, op:"replace" /主线进度/当前阶段, /主线进度/正史锚点.当前锚点 and /主线进度/当前节点 consistently (当前节点 = the first node ID of that chapter's event package per its 节点推进表; use 未进入事件包 only when no event package applies, e.g. fully custom openings with no canon anchor).
    Mainline locator semantics: /主线进度/当前锚点 names the active chapter (event package); /主线进度/当前节点 names its active node ID. Update 当前节点 with op:"replace" only when the story actually advances one node with real causality (max one major node per turn). Replace /主线进度/已完成节点 and /主线进度/可触发节点 as WHOLE arrays (idempotent), never insert individual entries. Chapter switching (当前锚点 change) requires an explicit fact: chapter reached its ending node, player explicitly skips/leaves, player explicitly picks a new anchor, explicit time-skip past the chapter window, or the event legitimately ends through player action. Record the old chapter's outcome (已完成/已跳过/已延后/已改写) and the switch reason in 正史锚点.玩家偏移. 支线 must never overwrite 当前锚点/当前节点.
    <UpdateVariable>
    <JSONPatch>
    [
      { "op": "replace", "path": "/在场人物", "value": ["御坂美琴-常盘台中学Lv5超电磁炮", "上条当麻-某高中右手寄宿幻想杀手的少年"] }
    ]
    </JSONPatch>
    </UpdateVariable>
  patch_rules:
    - The patch payload must be a valid JSON array inside <JSONPatch> within <UpdateVariable>. Never place the JSON array directly under <UpdateVariable>. Supported ops: replace, delta, insert, remove, move.
    - Never output op:"add". For array append use op:"insert" with a .../- path. For scalar/object field overwrite use op:"replace".
    - Never output analysis text or any explanatory text inside <UpdateVariable>; the first non-space tag after <UpdateVariable> must be <JSONPatch>, and the last non-space tag before </UpdateVariable> must be </JSONPatch>.
    - Paths are rooted at stat_data. Never use obsolete paths: /ability, /status, /location, /danger_risk, /lost_control_risk, /风险值, /当前异常事件, /行动建议, /最近行动判定, /规律推理记录, /隐藏档案, /可见档案.
    - Do not update readonly fields whose names start with _.
    - This card has NO risk value, NO decryption/anomaly-event system, and NO death mechanic. Do not output /风险值, /当前异常事件, /行动建议, /最近行动判定, /规律推理记录, /隐藏档案 or /可见档案 patches.
    - /在场人物 is a string array of NPCs currently in the scene with the player. Whenever the set of on-scene NPCs changes (someone appears, leaves, or is revealed), replace /在场人物 with the full current roster. Each entry is "名字-简述" (name then a short player-visible role/state, e.g. "御坂美琴-常盘台中学Lv5超电磁炮"). Use only characters actually present this turn; use [] when the player is truly alone. Never leave /在场人物 stale when NPCs are clearly present in the narration.
    - /能力档案 is an object array that must be replaced as a whole only when the roster changes. Use op:"replace" with the full current roster. Never use op:"insert" on this path unless a genuinely new ability is gained.
    - Each 能力档案 entry's 能力效果 must describe the ability's own mechanism, concrete effect and limitations from the player's own perspective; the player always knows their own ability, so NO story revelation is required. Urban-legend rumors / official-record vagueness are NPC-perception material (认知 field) and must NOT be written into the player's own ability file. If an entry's 能力效果 is still the baseline placeholder "依设定与剧情判定" OR any meta-text such as "尚未展现/待补全/待揭示/尚未在剧情中展现", treat it as a pending placeholder and replace it in the very next UpdateVariable output (do NOT wait for first activation) with a concrete effect you design from 能力名称 + 等级或位阶 + 阵营类型 and the canon setting. 实战运用 is an anticipatory usage guide (combat + non-combat), not a combat history; fill it in the same turn, never leave placeholder or meta text in either field. NEVER write penalty mechanics such as 反噬 (backlash) or 失控 (loss of control) into ANY 能力档案 field (both 能力效果 and 实战运用) — this card has no backlash system and ability costs are not modeled; the limitations clause may only describe the ability's own operational boundaries (range/duration/trigger conditions), never punitive consequences. Existing values containing 反噬/失控 wording must be replaced with compliant descriptions in the next UpdateVariable.
    - /任务追踪 is an object array; append new tasks with op:"insert" at /任务追踪/-. When a task's fields change, replace just that object via a full re-insert after remove, or replace the whole array.
    - /NPC关系 is an object array reflecting known NPCs and their 好感度/认知. Append newcomers with op:"insert" at /NPC关系/-. Keep 好感度 in 0-100. When an NPC's affiliation/relations change, update the matching object. Sort order is by 好感度 descending. /NPC关系 only tracks player-visible relationships; never invent hidden loyalty or plot inside it.
    - Fill each NPC's 能力名称/能力效果 ONLY with what the player has witnessed or learned in plot; leave them empty when unknown (panel hides empty). When the plot reveals more of an NPC's ability, replace that NPC's 能力字段. One short sentence max for 能力效果.
    - When ability use, magic casting, cross-faction conflict, item cost, or faction intervention occurs, update the matching ability/relation/worldline fields.
