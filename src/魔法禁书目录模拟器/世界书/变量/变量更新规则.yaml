---
变量更新规则:
  魔禁铁律:
    - 科学与魔法是两条力量体系：学园都市以「超能力」开发个人现实与 AIM 扩散力场；魔法侧以「术式/灵装」调用魔力。原著中二者对常人互斥——能力者 AIM 力场与魔力不相容，魔法师无个人现实才能、无法使用超能力；该互斥用于 NPC 演绎，不适用于玩家。
    - 玩家作为主角可自由兼用科学与魔法两体系：像原石（天生能力者）或特殊体质者那样无碍混用，不设反噬、不设代价、不判死亡、不设数值惩罚。NPC 仍受原著互斥约束，由 AI 按原著演绎。
    - 超能力通过 AIM 扩散力场相互影响；能力越强的人（Level 越高），自身 AIM 场越显著，越容易被魔法侧侦测或误伤。
    - 魔法伤害带有与科学不同的"位相"，能力者的个人现实无法像应对异能攻击那样自然化解魔法，必须按魔法侧规则结算。
  叙事基调:
    - 本卡是热血搞笑 + 主线/支线剧情导向，不设风险值、不设解密机制、不设死亡。
    - AI 可自由吐槽、整活、加入日常搞笑桥段；不要塑造冷漠无感情的形象。
    - 关键剧情允许热血与认真：战斗、对峙、拯救、爆发时刻应写得燃起来，但整体不走向压抑或死亡。
    - 玩家跨阵营可任意混用科学与魔法：不设反噬、不设代价、不判死亡、不设数值惩罚，由玩家自由发挥。
  【本篇能力与魔法结算】:
    - 【最高优先级补全任务】若「能力档案」任何字段出现占位符或元文本（"依设定与剧情判定""随剧情展开""尚未展现""待补全""待揭示"等），本轮 UpdateVariable 必须立即用 op:"replace" 补全为具体、可执行的实质描述，此项优先级高于本块其他变量操作；不得把占位文本原样保留到下一轮。
    - 「能力档案」是前端能力/术式面板的主要数据源。玩家新觉醒能力、获得术式、升级位阶、稳定或强化某项能力时，应更新对应对象的「能力名称、阵营类型、等级或位阶、能力效果、是否稳定、实战运用」.
    - 「能力效果」必须描述该能力本身的原理、具体效果与限制，以玩家自己知道的视角书写——玩家当然知道自己能力的详情，无需等剧情揭露。都市传说的模糊风闻、官方档案缺失等属于 NPC 认知维度（由「认知」字段承载），禁止写进玩家自己的能力档案。若开局表单未填写能力描述（基线为占位符"依设定与剧情判定"），AI 必须在下一轮 UpdateVariable 就用 op:"replace" 将「能力效果」补全为具体的效果描述：结合「能力名称」「等级或位阶」「阵营类型」与世界设定自行设计，不必等待该能力在剧情中首次发动。字段中禁止出现"尚未展现/待补全/待揭示/尚未在剧情中展现"等任何占位或元文本——发现此类文本一律视为待补全占位符并立即 replace。禁止把"反噬、失控"等惩罚性机制写进玩家能力档案的任何字段（能力效果/实战运用均适用）——本卡不设反噬限制，能力代价一律不设，限制段只描述能力自身的适用边界（范围/持续/触发条件），不写惩罚性后果；存量数据中含"反噬/失控"措辞的，应在下一次 UpdateVariable 一并 replace 为合规描述。
    - 「实战运用」由 AI 结合玩家当前能力和等级给出，应分战斗场景与非战斗场景两部分描述预期运用方式（战斗中如何运筹制胜、日常中如何影响事件）——它是前瞻性运用指南，不是战史记录，不要求该能力已在剧情中发动过；开局未填时与「能力效果」同轮立即补全，字段中禁止"尚未运用/待揭示"等占位或元文本。可在「能力档案.实战运用」中每轮更新，供正文末尾能力折叠面板展示。
  任务追踪:
    - 「任务追踪」承载玩家当前接受的主线/支线任务、委托或目标，数组元素字段：发布者、任务名称、任务类型、任务描述、任务目标、任务奖励、截止时间、当前进度。
    - 玩家新接受任务时 op:"insert" 到 /任务追踪/-；任务完成、失败或取消时 remove 对应条目或 replace 整个数组。
    - 「当前进度」体现任务推进度（如"40%"或"已到达目标地点"），随剧情逐步更新。
    - 无任务时 /任务追踪 为 []，正文末尾任务折叠面板显示「无」。
  NPC关系:
    - 「NPC关系」承载玩家与已知 NPC 的关系，数组元素字段：角色名、关系类型、关系状态描述、姓名、性别、年龄、性格、外貌、好感度、认知、能力名称、能力效果。
    - 好感度 0-100；关系建立初期给基础值（认识 20-40，友好 50-70，信任 80+，敌对另算）。随剧情互动增减。
    - 关系状态描述用一句话体现与玩家最近的互动结果（如"关系升温，美琴主动让{{user}}直呼其名"）。
    - 认知体现该 NPC 对"玩家"了解多少：陌生 / 知道名字 / 知道身份 / 知道能力 / 知道阵营 / 知道秘密。新 NPC 初始一律为"陌生"；仅按世界书"玩家能力与都市传说规则"的知情三层推进，NPC 言行与认知保持一致。
    - 能力名称/能力效果只写"玩家已目睹或已获知"的该 NPC 能力：未知则留空（面板不显示该行）；交手、见证能力发动或经剧情揭露后，用 replace 更新该 NPC 的能力字段。能力效果一句话以内，不写玩家尚未得知的隐藏底牌。
    - 引入新 NPC 时 op:"insert" 到 /NPC关系/-；正文末尾关系折叠面板按好感度从高到低排序显示。只能在已经明确发生互动时添加，不要凭空给 NPC 扣上关系。
  主线推进:
    - 「主线进度」记录世界大势、正史锚点、当前节点、玩家偏移和阶段推进，是主线剧情的主轴。
    - 三件套定位：「当前阶段」=大阶段；「正史锚点.当前锚点」=当前篇章（事件包，如“幻想御手篇”）；「当前节点」=篇章内正在推进的节点ID（如 FANTASY-HAND-03，格式见当前篇章事件包的节点推进表）。进入新篇章时 replace 当前锚点并把当前节点设为该包首节点；篇章内推进时用 op:"replace" 单值更新当前节点。
    - 节点字段硬性格式：「当前节点」「已完成节点」「可触发节点」的每一项都必须使用当前篇章事件包节点推进表中定义的完整节点ID原文（如 INDEX-FALL-01、ANGEL-FALL-03），逐字符照抄事件包文件，禁止改写为描述性文字、自创编号或简称；节点的语义说明只能写进消息正文或其他叙事字段，不得替换字段值。若剧情处于事件包首节点之前（如自定义开场铺垫），当前节点保持「未进入事件包」，推进到首节点时才写入首节点ID。
    - 「已完成节点」「可触发节点」变化时用 op:"replace" 替换整个数组（幂等），禁止用 op:"insert" 逐条追加导致重复累积。已完成节点只记录确实完成的节点ID；可触发节点只写当前可达的候选节点。
    - 篇章软锁定：当前锚点非空且阶段状态=进行中时，当前事件包是主线唯一优先。日常、委托、人物互动可穿插，但不得覆盖当前锚点与当前节点；后续篇章角色可作为合理客串，但不得提前启动后续篇章的核心事件；未完成当前核心节点时，不得因生成困难、玩家短暂离场或一次支线互动而换篇。每轮最多推进一个主要节点。
    - 合法换篇条件（仅以下事实之一允许更新当前锚点）：①当前事件包达到收束节点；②玩家明确要求跳过或离开当前篇章；③玩家明确选择新的时空锚点；④玩家明确时间跳跃并跨过当前篇章时间窗口；⑤事件因玩家行动或世界线变化合理终止。换篇时必须更新：原篇章阶段状态（已完成/已跳过/已延后/已改写）+ 换篇原因与关键偏移写入玩家偏移 + 新篇章首节点设为当前节点。
    - 三类偏离：篇章内偏离=玩家改变行动方式/人物关系但事件主题仍在→保留当前锚点，切换到事件包内分支节点；核心结果改写=玩家改变原著核心结局但事件因果已收束→保留当前锚点，阶段状态设为“已改写”，写入世界线记录；明确离开=玩家主动跳过/退出/时间跳跃→记录原因后关闭当前篇章，不强行拉回。
    - 玩家偏离必须记录具体事实到「正史锚点.玩家偏移」（写“玩家在XX节点做了什么、改变了什么”，不写抽象评价），偏移等级仅作兼容保留，不作为换篇或剧情路由依据。
    - 「当前阶段/当前锚点/当前节点/已完成节点」发现不一致时，以最近实际发生的剧情为准修正状态，不重置整局；旧聊天缺少当前节点字段时不回写历史，在下一次明确剧情行动时自然校准。
    - 「下一步推进提示」只用于模型内部保持节奏，不要当作明示任务强塞给玩家。
  支线触发:
    - 支线事件（学园都市委托、魔法侧遭遇、日常校园、大霸星祭、暗部冲突等）由玩家主动接近相关地点、人物或组织时触发，记录到「任务追踪」，任务类型标明“主线/支线”及所属篇章。
    - 支线不得覆盖「主线进度.正史锚点.当前锚点」与「主线进度.当前节点」，也不得据此换篇。
    - 支线可与主线并行，完成后通常影响「NPC关系」「势力关系」或「世界线记录」。
  物品消耗:
    - 使用道具、灵装、术式媒介、魔道书等物品时，必须更新「物品.持有物」中的剩余状态、数量或效果变化。
    - 「物品.持有物」的每项物品为对象，字段：{ 名称, 类型, 数量, 效果 }。不得用字符串（如"电磁炮x3"）或非标准字段名。
    - 资金等通用资源写入「物品.资金」字符串（如"2000日元"、"100万日元"）。
  势力关系:
    - 学园都市、统括理事会、风纪委员、暗部、英国清教、罗马正教、俄罗斯成教等势力介入时，必须更新「势力关系」中的所属阵营、所属组织、联系人、敌对势力或可调用资源。
  世界线记录:
    - 玩家改变关键人物状态、物品归属、地点封锁状态、学园都市/宗教势力行动或原剧情节点时，必须写入「世界线记录」。
  输出约束:
    - 变量更新必须只基于本轮回复中实际发生或明确揭示的内容。
    - 状态面板要使用玩家可感知的信息。
